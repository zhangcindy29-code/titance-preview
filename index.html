<title>Titance Legal 案件与合规平台</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap">

<style>
:root{
  --canvas:#F8FAFC; --panel:#FFFFFF; --alt:#FAFBFD; --hover:#F1F5F9; --sel:#E8EEF7;
  --line:#E2E8F0; --line2:#CBD5E1;
  --ink:#0F172A; --ink2:#475569; --ink3:#64748B;
  --pri:#162B45; --pri-ink:#FFFFFF; --pri-edge:#0F1E31; --pri-tint:#EEF2F8;
  --ok:#0F766E; --ok-bg:#EFFBF7; --ok-edge:#0F766E;
  --warn:#B45309; --warn-bg:#FFFBEB; --warn-edge:#D97706;
  --crit:#BE123C; --crit-bg:#FFF1F2; --crit-edge:#BE123C;
  --sans:"IBM Plex Sans","Inter",-apple-system,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  --body:"Inter","IBM Plex Sans",-apple-system,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --canvas:#0A1120; --panel:#101A2B; --alt:#0D1626; --hover:#16233A; --sel:#1B2B45;
  --line:#1E2B41; --line2:#2E3F5B;
  --ink:#E3E9F2; --ink2:#93A2B8; --ink3:#7A8AA3;
  --pri:#3D5F91; --pri-ink:#F2F7FE; --pri-edge:#4E74AA; --pri-tint:#15243A;
  --ok:#4FBFA8; --ok-bg:#0D2220; --ok-edge:#2C7F72;
  --warn:#D9A04A; --warn-bg:#241C0C; --warn-edge:#8A6A2C;
  --crit:#E8778C; --crit-bg:#2A1219; --crit-edge:#8E3B4C;
}}
:root[data-theme="dark"]{
  --canvas:#0A1120; --panel:#101A2B; --alt:#0D1626; --hover:#16233A; --sel:#1B2B45;
  --line:#1E2B41; --line2:#2E3F5B;
  --ink:#E3E9F2; --ink2:#93A2B8; --ink3:#7A8AA3;
  --pri:#3D5F91; --pri-ink:#F2F7FE; --pri-edge:#4E74AA; --pri-tint:#15243A;
  --ok:#4FBFA8; --ok-bg:#0D2220; --ok-edge:#2C7F72;
  --warn:#D9A04A; --warn-bg:#241C0C; --warn-edge:#8A6A2C;
  --crit:#E8778C; --crit-bg:#2A1219; --crit-edge:#8E3B4C;
}

*{box-sizing:border-box}
body{background:var(--canvas);color:var(--ink);font-family:var(--body);font-size:13px;line-height:1.55;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer;border-radius:0}
:focus-visible{outline:2px solid var(--pri-edge);outline-offset:1px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
.m{font-family:var(--mono);font-variant-numeric:tabular-nums lining-nums}
h1,h2,h3{font-family:var(--sans);margin:0}
.caps{font-family:var(--sans);font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase}

/* ---- shell ---- */
.app{display:grid;grid-template-columns:232px 1fr;min-height:100vh}
@media(max-width:820px){.app{grid-template-columns:1fr}}
.side{background:var(--panel);border-right:1px solid var(--line2);display:flex;flex-direction:column}
.logo{padding:11px 14px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:1px}
.logo b{font-family:var(--sans);font-size:14px;font-weight:700;letter-spacing:.02em}
.logo span{font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink3);font-family:var(--sans);font-weight:600}
.navsec{padding:14px 14px 5px;color:var(--ink3)}
.nav{display:flex;flex-direction:column}
.nav button{display:flex;align-items:center;gap:9px;width:100%;text-align:left;padding:7px 14px;font-size:12.5px;color:var(--ink2);border-left:3px solid transparent}
.nav button:hover{background:var(--hover);color:var(--ink)}
.nav button[aria-current="true"]{background:var(--pri);color:var(--pri-ink);border-left-color:var(--pri-edge);font-weight:600}
.nav .bdg{margin-left:auto;font-family:var(--mono);font-size:10px;font-weight:600;padding:1px 5px;border:1px solid var(--line2);color:var(--ink2);min-width:19px;text-align:center}
.nav button[aria-current="true"] .bdg{border-color:rgba(255,255,255,.35);color:var(--pri-ink)}
.nav .bdg.c{background:var(--crit-bg);border-color:var(--crit-edge);color:var(--crit)}
.sysbar{margin-top:auto;border-top:1px solid var(--line);padding:9px 14px;display:flex;flex-direction:column;gap:4px;font-family:var(--mono);font-size:10px;color:var(--ink3)}
.sysbar i{font-style:normal;color:var(--ok)}

.main{min-width:0;display:flex;flex-direction:column}
.top{display:flex;align-items:center;gap:12px;padding:8px 16px;border-bottom:1px solid var(--line2);background:var(--panel);flex-wrap:wrap}
.search{flex:1;min-width:180px;max-width:430px;display:flex;align-items:center;gap:7px;border:1px solid var(--line2);padding:4px 8px;color:var(--ink3);font-size:12px;background:var(--canvas)}
.search kbd{margin-left:auto;font-family:var(--mono);font-size:9.5px;border:1px solid var(--line2);padding:0 3px}
.clock{font-family:var(--mono);font-size:11px;color:var(--ink2);display:flex;align-items:center;gap:6px}
.dotok{width:6px;height:6px;background:var(--ok);flex:none}
.lang{margin-left:auto;display:flex;border:1px solid var(--line2)}
.lang button{padding:3px 10px;font-size:11.5px;font-family:var(--sans);font-weight:600;color:var(--ink3)}
.lang button[aria-pressed="true"]{background:var(--pri);color:var(--pri-ink)}
.me{display:flex;align-items:center;gap:7px;padding-left:12px;border-left:1px solid var(--line)}
.me .av{width:24px;height:24px;background:var(--pri);color:var(--pri-ink);display:grid;place-items:center;font-family:var(--mono);font-size:10px;font-weight:600}
.me .nm{font-size:12px;font-weight:600;line-height:1.2}
.me .no{font-family:var(--mono);font-size:9.5px;color:var(--ink3)}

.view{padding:16px;display:flex;flex-direction:column;gap:14px}
.view[hidden]{display:none}
.ph{display:flex;align-items:flex-end;gap:12px;flex-wrap:wrap}
.ph h1{font-size:22px;font-weight:600;letter-spacing:-.02em}
.ph .tag{border:1px solid var(--line2);padding:1px 7px;color:var(--ink2);font-size:10px}
.ph .sub{flex-basis:100%;font-size:12px;color:var(--ink2)}
.ph .acts{margin-left:auto;display:flex;gap:7px}

.btn{border:1px solid var(--line2);background:var(--panel);padding:4px 10px;font-size:12px;color:var(--ink);display:inline-flex;align-items:center;gap:6px}
.btn:hover{background:var(--hover)}
.btn-p{background:var(--pri);color:var(--pri-ink);border-color:var(--pri-edge)}
.btn-p:hover{background:var(--pri);opacity:.9}
.btn kbd{font-family:var(--mono);font-size:9.5px;border:1px solid currentColor;opacity:.5;padding:0 3px}

/* ---- tiles ---- */
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px}
.tile{border:1px solid var(--line2);background:var(--panel);padding:10px 12px;display:flex;flex-direction:column;gap:5px;text-align:left;border-top-width:2px}
.tile:hover{background:var(--hover)}
.tile .th{display:flex;align-items:center;gap:6px}
.tile .th .caps{color:var(--ink3)}
.tile .n{font-family:var(--mono);font-size:27px;font-weight:600;line-height:1.05;letter-spacing:-.03em}
.tile .l{font-size:12px;color:var(--ink2)}
.tile .f{border-top:1px solid var(--line);padding-top:5px;font-size:10.5px;color:var(--ink3);display:flex;gap:5px;align-items:center}
.tile.q{border-top-color:var(--pri)}
.tile.c{border-top-color:var(--crit)} .tile.c .n,.tile.c .th .caps{color:var(--crit)}
.tile.w{border-top-color:var(--warn)} .tile.w .n{color:var(--warn)}
.tile.o{border-top-color:var(--ok)} .tile.o .n{color:var(--ok)}

/* ---- panel + table ---- */
.pn{border:1px solid var(--line2);background:var(--panel)}
.pnh{display:flex;align-items:center;gap:9px;padding:7px 12px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.pnh h2{font-size:13px;font-weight:600}
.pnh .r{margin-left:auto;display:flex;gap:7px;align-items:center;font-size:11px;color:var(--ink3)}
.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%;min-width:720px}
th{font-family:var(--sans);font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--ink3);text-align:left;padding:6px 12px;border-bottom:1px solid var(--line2);white-space:nowrap;background:var(--alt)}
td{padding:6px 12px;border-bottom:1px solid var(--line);font-size:12.5px;vertical-align:middle}
tbody tr:last-child td{border-bottom:none}
tr.ck{cursor:pointer} tr.ck:hover td{background:var(--hover)}
td.n{font-family:var(--mono);font-variant-numeric:tabular-nums;white-space:nowrap}
td.idx{font-family:var(--mono);font-size:11px;color:var(--ink3);width:34px}

/* ---- chips ---- */
.c{display:inline-flex;align-items:center;gap:4px;height:19px;padding:0 6px;font-size:10.5px;font-weight:600;border:1px solid;white-space:nowrap;font-family:var(--sans)}
.c i{width:5px;height:5px;background:currentColor;flex:none;font-style:normal}
.c-ok{background:var(--ok-bg);color:var(--ok);border-color:var(--ok-edge)}
.c-w{background:var(--warn-bg);color:var(--warn);border-color:var(--warn-edge)}
.c-c{background:var(--crit-bg);color:var(--crit);border-color:var(--crit-edge)}
.c-n{background:var(--canvas);color:var(--ink2);border-color:var(--line2)}
.c.mo{font-family:var(--mono)}

/* ---- triage ---- */
.tri{display:grid;grid-template-columns:minmax(280px,370px) 1fr;border:1px solid var(--line2);background:var(--panel)}
@media(max-width:980px){.tri{grid-template-columns:1fr}}
.ql{border-right:1px solid var(--line2);display:flex;flex-direction:column;min-width:0}
@media(max-width:980px){.ql{border-right:none;border-bottom:1px solid var(--line2)}}
.qlh{display:flex;align-items:center;gap:8px;padding:7px 12px;border-bottom:1px solid var(--line);background:var(--alt)}
.qlh h2{font-size:12.5px;font-weight:600}
.qlh .cnt{font-family:var(--mono);font-size:10px;font-weight:600;background:var(--pri);color:var(--pri-ink);padding:1px 6px}
.qi{display:block;width:100%;text-align:left;padding:8px 12px;border-bottom:1px solid var(--line);border-left:3px solid transparent}
.qi:hover{background:var(--hover)}
.qi[aria-selected="true"]{background:var(--sel);border-left-color:var(--pri-edge)}
.qi .r1{display:flex;gap:8px;align-items:baseline}
.qi .fr{font-weight:600;font-size:12.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.qi .tm{margin-left:auto;font-family:var(--mono);font-size:10.5px;color:var(--ink3);flex:none}
.qi .sj{font-size:12px;color:var(--ink2);margin:2px 0 5px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.qi .cs{display:flex;gap:5px;flex-wrap:wrap}
.qempty{padding:44px 16px;text-align:center;color:var(--ink3);font-size:12.5px}

.qd{display:flex;flex-direction:column;min-width:0}
.qdh{padding:9px 14px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:5px}
.qdh h2{font-size:16px;font-weight:600;letter-spacing:-.01em}
.qdh .meta{font-family:var(--mono);font-size:10.5px;color:var(--ink3);display:flex;gap:14px;flex-wrap:wrap}
.qdb{padding:12px 14px;display:flex;flex-direction:column;gap:12px;flex:1;min-width:0}
.msg{border:1px solid var(--line);background:var(--alt);padding:10px 12px;font-size:12.5px;color:var(--ink2);white-space:pre-wrap;line-height:1.7}
.atts{display:flex;gap:8px;flex-wrap:wrap}
.att{display:flex;align-items:center;gap:8px;border:1px solid var(--line2);padding:6px 9px;background:var(--panel)}
.att .ic{font-family:var(--mono);font-size:9px;font-weight:700;padding:2px 4px;border:1px solid var(--line2);color:var(--ink2)}
.att .fn{font-size:12px;font-weight:500}
.att .fs{font-family:var(--mono);font-size:10px;color:var(--ink3)}

.dest{border:2px solid var(--pri);background:var(--pri-tint)}
.desth{display:flex;align-items:center;gap:8px;padding:6px 11px;background:var(--pri);color:var(--pri-ink);flex-wrap:wrap}
.desth .caps{color:var(--pri-ink);opacity:.9}
.desth .mt{margin-left:auto;font-family:var(--mono);font-size:10px;font-weight:600;border:1px solid rgba(255,255,255,.4);padding:1px 6px}
.destb{display:grid;grid-template-columns:minmax(150px,auto) 1fr;gap:14px;padding:12px}
@media(max-width:620px){.destb{grid-template-columns:1fr}}
.destb .lft{border-right:1px solid var(--line2);padding-right:14px}
@media(max-width:620px){.destb .lft{border-right:none;border-bottom:1px solid var(--line2);padding:0 0 10px}}
.destb .no{font-family:var(--mono);font-size:23px;font-weight:600;letter-spacing:-.02em;line-height:1.1}
.destb .cl{font-size:13px;font-weight:600;margin-top:2px}
.refs{display:flex;gap:6px;flex-wrap:wrap;margin-top:7px}
.why{border-top:1px solid var(--line2);padding:8px 12px;display:flex;gap:14px;flex-wrap:wrap;font-size:11.5px;color:var(--ink2)}
.why b{display:block;color:var(--ink3)}
.bar{border-top:1px solid var(--line2);padding:9px 14px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;background:var(--alt)}
.pick{border-top:1px solid var(--line2);max-height:186px;overflow-y:auto;background:var(--panel)}
.pick button{display:flex;width:100%;text-align:left;gap:10px;align-items:baseline;padding:6px 12px;border-bottom:1px solid var(--line);font-size:12px}
.pick button:hover{background:var(--hover)}
.pick .pn0{font-family:var(--mono);font-weight:600;flex:none}
.pick .pc{font-weight:600}
.pick .pa{color:var(--ink3);font-size:11px;margin-left:auto;text-align:right}
.bar .au{font-family:var(--mono);font-size:10px;color:var(--ink3);margin-right:auto}

/* ---- matter ---- */
.mh{border:1px solid var(--line2);background:var(--panel);padding:11px 14px;display:flex;flex-direction:column;gap:7px}
.mh .r1{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.mh .mno{font-family:var(--mono);font-size:12px;border:1px solid var(--line2);padding:2px 7px;color:var(--ink2)}
.mh .cli{font-size:19px;font-weight:600;letter-spacing:-.01em}
.mh .adr{font-size:12.5px;color:var(--ink2)}
.mh .adr b{font-family:var(--mono);font-weight:400;color:var(--ink3)}
.stw{overflow-x:auto;border:1px solid var(--line2);background:var(--panel)}
.st{display:flex;min-width:880px}
.sti{flex:1;padding:7px 11px;border-right:1px solid var(--line);display:flex;flex-direction:column;gap:1px}
.sti:last-child{border-right:none}
.sti .sn{font-family:var(--mono);font-size:9.5px;color:var(--ink3)}
.sti .stt{font-size:11.5px;font-weight:600;color:var(--ink2);line-height:1.3}
.sti .ss{font-family:var(--mono);font-size:9.5px;color:var(--ink3)}
.sti[data-s="done"]{background:var(--ok-bg)} .sti[data-s="done"] .stt{color:var(--ok)} .sti[data-s="done"] .ss{color:var(--ok)}
.sti[data-s="now"]{background:var(--pri)} .sti[data-s="now"] .stt,.sti[data-s="now"] .sn{color:var(--pri-ink)}
.sti[data-s="now"] .ss{color:var(--pri-ink);opacity:.85}

.tabs{display:flex;border:1px solid var(--line2);border-bottom:none;background:var(--panel);flex-wrap:wrap}
.tabs button{padding:8px 14px;font-size:12.5px;color:var(--ink2);border-right:1px solid var(--line);display:flex;align-items:center;gap:7px}
.tabs button:hover{background:var(--hover)}
.tabs button[aria-selected="true"]{background:var(--canvas);color:var(--ink);font-weight:600;box-shadow:inset 0 2px 0 var(--pri)}
.pane{border:1px solid var(--line2);background:var(--panel);display:flex;flex-direction:column}
.pane[hidden]{display:none}

.alert{border:1px solid var(--crit-edge);background:var(--crit-bg);margin:12px;display:flex;flex-direction:column}
.alh{display:flex;align-items:center;gap:9px;padding:8px 12px;border-bottom:1px solid var(--crit-edge);flex-wrap:wrap}
.alh h3{font-size:13.5px;font-weight:600;color:var(--crit)}
.alb{display:grid;grid-template-columns:1fr minmax(190px,auto);gap:12px;padding:12px}
@media(max-width:720px){.alb{grid-template-columns:1fr}}
.alb ol{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:8px}
.alb li{display:grid;grid-template-columns:20px 1fr;gap:8px;border:1px solid var(--crit-edge);background:var(--panel);padding:7px 9px}
.alb li .i{font-family:var(--mono);font-size:10px;font-weight:600;color:var(--crit);border:1px solid var(--crit-edge);width:18px;height:18px;display:grid;place-items:center}
.alb li b{font-size:12.5px;display:block}
.alb li span{font-size:11.5px;color:var(--ink2);display:block}
.alr{display:flex;flex-direction:column;gap:8px;border-left:1px solid var(--crit-edge);padding-left:12px}
@media(max-width:720px){.alr{border-left:none;padding-left:0}}
.alr .law{font-family:var(--mono);font-size:10.5px;color:var(--ink2);line-height:1.6}

.grp td{background:var(--alt);font-family:var(--sans);font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--ink2);padding:5px 12px}
tr.miss td{background:var(--crit-bg)}
tr.miss td b{color:var(--crit);font-weight:600}
tr.miss td span{font-size:11px;color:var(--ink2);display:block}

.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(212px,1fr))}
.kv>div{border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:10px 12px;display:flex;flex-direction:column;gap:4px}
.kv dt{color:var(--ink3)}
.kv dd{margin:0;font-size:13px}
.kv .ex{font-size:11px;color:var(--ink3);line-height:1.5}
.log{display:flex;flex-direction:column}
.lg{display:grid;grid-template-columns:130px 82px 1fr;gap:10px;padding:5px 12px;border-bottom:1px solid var(--line);font-size:12px;align-items:baseline}
.lg:last-child{border-bottom:none}
.lg .ts{font-family:var(--mono);font-size:10.5px;color:var(--ink3)}
.lg .ac{font-weight:600;font-size:11.5px}
.lg .ev{color:var(--ink2)}
@media(max-width:620px){.lg{grid-template-columns:1fr;gap:1px}}

.foot{padding:7px 12px;border-top:1px solid var(--line);background:var(--alt);display:flex;gap:16px;flex-wrap:wrap;font-family:var(--mono);font-size:10px;color:var(--ink3)}
.foot b{color:var(--ok);font-weight:500}
.note{font-size:11.5px;color:var(--ink3);line-height:1.65}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--pri);color:var(--pri-ink);border:1px solid var(--pri-edge);padding:7px 14px;font-size:12.5px;z-index:60;display:flex;align-items:center;gap:8px}
.draft{border:1px solid var(--line2);background:var(--alt);margin:0 12px 12px;display:flex;flex-direction:column}
.draft pre{margin:0;padding:12px;font-family:var(--body);font-size:12.5px;line-height:1.8;white-space:pre-wrap;color:var(--ink2);max-height:330px;overflow-y:auto}
</style>

<div class="app">
  <aside class="side">
    <div class="logo"><b>TITANCE LEGAL</b><span data-t="firmsub"></span></div>
    <div class="navsec caps" data-t="navwork"></div>
    <nav class="nav">
      <button data-go="today" aria-current="true"><span data-t="nav.today"></span></button>
      <button data-go="mail"><span data-t="nav.mail"></span><span class="bdg" id="nb">6</span></button>
      <button data-go="matters"><span data-t="nav.matters"></span><span class="bdg">7</span></button>
    </nav>
    <div class="navsec caps" data-t="navcomp"></div>
    <nav class="nav">
      <button data-go="aml"><span data-t="nav.aml"></span><span class="bdg c">3</span></button>
    </nav>
    <div class="sysbar">
      <span><i>●</i> AUSTRAC Gateway — <span data-t="sys.live"></span></span>
      <span><i>●</i> PEXA Network API — <span data-t="sys.sync"></span></span>
      <span>AWS ap-southeast-2 · Sydney</span>
    </div>
  </aside>

  <div class="main">
    <header class="top">
      <div class="search"><span>⌕</span><span data-t="search"></span><kbd>⌘K</kbd></div>
      <span class="clock"><span class="dotok"></span><span class="m">AEST 14:42</span></span>
      <div class="lang" role="group">

/* triage */
let sel=1;
function renderQ(){
  $("#qcnt").textContent=Q.length; $("#nb").textContent=Q.length;
  const tl=$("#tiles").querySelector(".tile .n"); if(tl) tl.textContent=Q.length;
  if(!Q.length){ $("#qlist").innerHTML=`<p class="qempty">${t("mail.empty")}</p>`;
    $("#qdetail").innerHTML=`<p class="qempty">${t("mail.emptyd")}</p>`; return; }
  if(!Q.some(x=>x.id===sel)) sel=Q[0].id;
  $("#qlist").innerHTML=Q.map(m=>`<button class="qi" data-id="${m.id}" aria-selected="${m.id===sel}">
    <span class="r1"><span class="fr">${m.from}</span><span class="tm">${m.tm}</span></span>
    <span class="sj">${L(m.sj)}</span>
    <span class="cs">${m.exact?chip("c-ok",t("mail.matched"),true):chip("c-w",t("mail.sugg"),true)}
    ${m.at.length?chip("c-n",m.at.length+" "+t("mail.att")):""}</span></button>`).join("");
  $("#qlist").querySelectorAll(".qi").forEach(b=>b.addEventListener("click",()=>{sel=+b.dataset.id;renderQ();}));
  renderD();
}
function renderD(){
  const m=Q.find(x=>x.id===sel); if(!m) return;
  const mt=MT.find(x=>x[0]===m.m);
  $("#qdetail").innerHTML=`
  <div class="qdh"><h2>${L(m.sj)}</h2>
    <div class="meta"><span>${t("mail.from")}: ${m.from} &lt;${m.addr}&gt;</span><span>${t("mail.time")}: 13/09/2026 ${m.tm} AEST</span><span>DKIM: PASS</span></div></div>
  <div class="qdb">
    <div class="msg">${L(m.bd)}</div>
    ${m.at.length?`<div class="atts">${m.at.map(([ic,fn,fs])=>
      `<span class="att"><span class="ic">${ic}</span><span><span class="fn">${fn}</span><br><span class="fs">${fs}</span></span></span>`).join("")}
      ${chip("c-ok",t("mail.avok"),true)}</div>`:""}
    <div class="dest">
      <div class="desth"><span class="caps">${t("mail.dest")}</span>
        <span class="mt">${m.exact?(LG==="zh"?"精确匹配":"EXACT MATCH"):(LG==="zh"?"待核对":"TO VERIFY")}</span></div>
      <div class="destb">
        <div class="lft"><span class="caps" style="color:var(--ink3)">${t("mail.ref")}</span>
          <div class="no">${mt[0]}</div><div class="cl">${mt[1]}</div>
          <div class="refs">${chip("c-n",L(mt[2]))}</div></div>
        <div><span class="caps" style="color:var(--ink3)">${t("mail.prop")}</span>
          <div style="font-size:13px;margin-top:3px">${mt[3]}</div>
          <div class="refs">${(REF[m.m]||[]).map(r=>chip("c-n mo",r)).join("")}</div></div>
      </div>
      <div class="why">
        <span><b>${t("mail.rat")}</b>${m.manual?t("mail.manual"):L(m.wy)}</span>
      </div>
      <div class="pick" id="pick" hidden>${MT.map(x=>`<button data-pick="${x[0]}"><span class="pn0">${x[0]}</span><span class="pc">${x[1]}</span><span class="pa">${x[3]}</span></button>`).join("")}</div>
    </div>
  </div>
  <div class="bar"><span class="au">${t("mail.audit")}</span>
    <button class="btn" id="skip">${t("mail.skip")}</button>
    <button class="btn" id="chg" aria-expanded="false">${t("mail.chg")}</button>
    <button class="btn btn-p" id="ok">${t("mail.file")}${m.at.length?" ("+m.at.length+")":""} <kbd>⏎</kbd></button></div>`;
  $("#chg").addEventListener("click",()=>{const pk=$("#pick"),op=pk.hidden;pk.hidden=!op;
    $("#chg").setAttribute("aria-expanded",op);if(op)pk.scrollIntoView({block:"nearest"});});
  $("#pick").querySelectorAll("[data-pick]").forEach(b=>b.addEventListener("click",()=>{
    m.m=b.dataset.pick;m.manual=true;m.exact=false;renderQ();}));
  $("#skip").addEventListener("click",()=>{
    Q=Q.filter(x=>x.id!==m.id).concat([m]);sel=Q[0].id;renderQ();toast(t("mail.defer"));});
  $("#ok").addEventListener("click",()=>{
    Q=Q.filter(x=>x.id!==m.id); renderQ();
    toast(t("mail.filed")+" "+mt[0]+" · "+mt[1]);
  });
}
let tt;
function toast(s){document.querySelector(".toast")?.remove();
  const n=document.createElement("div");n.className="toast";n.textContent="✓ "+s;
  document.body.appendChild(n);clearTimeout(tt);tt=setTimeout(()=>n.remove(),2600);}

/* nav */
const VT={today:"today",mail:"mail",matters:"matters",matter:"matter",aml:"aml"};
function go(v){
  document.querySelectorAll(".view").forEach(s=>s.hidden=s.id!=="v-"+v);
  document.querySelectorAll(".nav button").forEach(b=>b.setAttribute("aria-current",b.dataset.go===v?"true":"false"));
  window.scrollTo(0,0);
}
document.addEventListener("click",e=>{
  const ac=e.target.closest("[data-act]");
  if(ac){const k=ac.dataset.act;
    if(k==="pack")toast(t("mail.packed"));
    if(k==="outlook")toast(t("mail.outlook"));
    if(k==="regen")toast(LG==="zh"?"草稿已重新生成（演示）":"Draft regenerated (demo)");
    return;}
  const g=e.target.closest("[data-go]"); if(g){go(g.dataset.go);return;}
  const r=e.target.closest("tr.ck");
  if(r){ openMatter(r.dataset.no, r.dataset.aml?2:0); }
});
$("#back").addEventListener("click",()=>go("matters"));
$("#lz").addEventListener("click",()=>{LG="zh";paint();});
$("#le").addEventListener("click",()=>{LG="en";paint();});
paint(); showTab("docs");
</script>
